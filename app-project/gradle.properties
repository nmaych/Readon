org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Compile Kotlin inside the Gradle process instead of a separate daemon. The
# daemon writes its connection marker under the user profile, which is not
# writable in this sandbox, so every build would otherwise pay a failed daemon
# handshake before falling back here anyway.
kotlin.compiler.execution.strategy=in-process
