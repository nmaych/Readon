name: Release

# Tag-driven: pushing v1.0.1 builds, signs, publishes and updates the manifest.
#
# The tag is the single source of truth for the version. The workflow parses it
# once and feeds the result to Gradle, the APK filename, the release name and
# dist/update.json -- so those four cannot disagree, which is the failure that
# produces an update prompt the user can never clear.

on:
  push:
    tags:
      - 'v*'
  # Lets a release be re-run from the Actions tab without re-tagging, which is
  # what is needed when a build fails for an infrastructure reason.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # One release per tag at a time; a half-finished release must not interleave
  # with a retry of the same version.
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"
          # Same scheme as UpdateManager.versionCodeOf and tools/ci_release.py,
          # and the reason the app compares versionCode rather than the version
          # name: string comparison puts 1.10.0 before 1.9.0.
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "name=$NAME"     >> "$GITHUB_OUTPUT"
          echo "code=$CODE"     >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME (versionCode $CODE) from tag $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # `packages` is spelled out rather than left to the action's default.
          # The default is `tools platform-tools`, and Google has since removed the
          # legacy `tools` package from the SDK repository: sdkmanager answers
          # "Warning: Failed to find package 'tools'" and exits 1, which failed this
          # workflow on every tag from v1.0.7 through v1.0.9 while the code was fine.
          # `platform-tools` is the only one actually needed here; the build's own
          # SDK packages are installed by the next step.
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The project's own wrapper is the authority on the Gradle version.
          validate-wrappers: true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.READON_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::secret READON_KEYSTORE_BASE64 is not set. A release"
            echo "::error::must be signed with the same key as previous ones, or"
            echo "::error::installed apps cannot upgrade in place."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/readon-release.jks"
          echo "READON_KEYSTORE_FILE=$RUNNER_TEMP/readon-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: app-project
        env:
          READON_VERSION_CODE: ${{ steps.version.outputs.code }}
          READON_VERSION_NAME: ${{ steps.version.outputs.name }}
          # READON_KEYSTORE_FILE is not repeated here: the decode step wrote it
          # to $GITHUB_ENV, which exports it to every later step.
          READON_KEYSTORE_PASSWORD: ${{ secrets.READON_KEYSTORE_PASSWORD }}
          READON_KEY_ALIAS: ${{ secrets.READON_KEY_ALIAS }}
          READON_KEY_PASSWORD: ${{ secrets.READON_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verify the APK is signed
        working-directory: app-project
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK was not produced"
            exit 1
          fi
          # An unsigned or debug-signed APK is worse than no release: it installs
          # on a fresh device and then cannot be upgraded.
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK" \
            || { echo "::error::APK signature did not verify"; exit 1; }

      - name: Stage artefacts
        id: stage
        run: |
          set -euo pipefail
          NAME="${{ steps.version.outputs.name }}"
          mkdir -p out
          cp app-project/app/build/outputs/apk/release/app-release.apk \
             "out/readon-${NAME}.apk"
          # The digest the app checks before installing an update.
          sha256sum "out/readon-${NAME}.apk" | cut -d' ' -f1 > "out/readon-${NAME}.apk.sha256"
          echo "sha256=$(cat "out/readon-${NAME}.apk.sha256")" >> "$GITHUB_OUTPUT"
          ls -l out

      - name: Update dist/update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          SHA="$(cat "out/readon-${NAME}.apk.sha256")"
          # The bookkeeping lives in a script rather than inline shell so it can
          # be run and tested locally, and so the version-code arithmetic is
          # asserted in one place instead of three.
          python3 tools/ci_release.py \
            --name "$NAME" \
            --code "$CODE" \
            --sha "$SHA" \
            --apk "out/readon-${NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-out "$RUNNER_TEMP/notes.md"
          # Keep the generated manifest aside: the next step rebuilds the working
          # tree on the default branch, which would otherwise discard it.
          cp dist/update.json "$RUNNER_TEMP/update.json"

      - name: Commit the manifest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tag being released may not be the tip of the default branch, and
          # the checkout is a detached HEAD at the tag. So the manifest commit is
          # rebuilt on top of the current default branch rather than on the tag --
          # otherwise the push is rejected as a non-fast-forward, or worse,
          # rewinds the branch.
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp "$RUNNER_TEMP/update.json" dist/update.json

          git add dist/update.json
          if git diff --cached --quiet; then
            echo "manifest already current"
          else
            git commit -m "chore(release): update.json for ${{ steps.version.outputs.name }}"
            git push origin "$DEFAULT_BRANCH"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          NAME="${{ steps.version.outputs.name }}"
          NOTES_FILE="$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a release must replace the asset rather than fail.
            gh release upload "$TAG" out/*.apk --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --title "Readon $NAME" \
              --notes-file "$NOTES_FILE" \
              --target "${{ github.event.repository.default_branch }}" \
              out/*.apk
          fi
