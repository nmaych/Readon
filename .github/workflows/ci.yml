name: CI

# Compile check on every push and pull request. Deliberately does not sign, does
# not publish and does not touch dist/update.json -- it only answers "does this
# still build", which is the question that matters before a tag is cut.

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is `tools platform-tools`, and Google has removed
          # the legacy `tools` package from the SDK repository -- sdkmanager then
          # answers "Warning: Failed to find package 'tools'" and exits 1, which is
          # what made this job fail on every push since v1.0.7. The build's own SDK
          # packages are installed by the next step, so only platform-tools is
          # requested here.
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Make the Gradle wrapper executable
        working-directory: app-project
        # The bit is set in the index now, but a checkout that goes through a
        # filesystem or an export step that drops modes would still break here,
        # and "Permission denied" reads like a broken repository rather than a
        # missing mode. One chmod is cheaper than that diagnosis.
        #
        # Nothing in this workflow checks out another branch afterwards, so a
        # dirty tree is harmless here -- unlike in release.yml, which switches to
        # the default branch to commit the manifest.
        run: chmod +x gradlew

      # No signing inputs are provided on purpose. The build script treats
      # "all four signing inputs" and "none" as the two valid states, so this
      # exercises the unsigned path and proves a fresh clone still builds.
      - name: Assemble debug
        working-directory: app-project
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Check the manifest is valid JSON
        # Calls the script the repository ships rather than an inline copy, so
        # the check that runs here and the one a contributor runs locally cannot
        # drift apart.
        run: python3 tools/check_manifest.py

      - name: Check the repository configuration
        env:
          # The workflow parse-check is delegated to Node and js-yaml. The runner
          # has Node but not js-yaml, and the workflows were already validated by
          # the time this runs, so it is skipped rather than failed.
          READON_SKIP_WORKFLOW_CHECK: '1'
        run: python3 tools/check_repo_config.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: readon-debug
          path: app-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
